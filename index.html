<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaMart</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <div class="top-bar">
    <div>Welcome to worldwide Megamart!</div>
    <div class="top-bar-right">
      <div class="top-bar-item">
        <i class="fa-solid fa-location-dot"></i>
        <span>Deliver to <b>423651</b></span>
      </div>
      <div class="top-bar-item">
        <i class="fa-solid fa-truck"></i>
        <span>Track your order</span>
      </div>
      <div class="top-bar-item">
        <i class="fa-solid fa-percent"></i>
        <span>All Offers</span>
      </div>
    </div>
  </div>

  <header class="main-header">
    <div class="logo-container">
      <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
      </div>
      <a href="#" class="logo">MegaMart</a>
    </div>

    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Search essentials, groceries and more...">
    </div>

    <div class="header-actions">
      <a href="#" class="action-item">
        <i class="fa-regular fa-user"></i>
        <span>Sign Up/Sign In</span>
      </a>
      <div class="divider"></div>
      <a href="#" class="action-item">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Cart</span>
      </a>
    </div>
  </header>

  <nav class="categories-nav">
    <button class="category-btn active">Groceries <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Premium Fruits <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Home & Kitchen <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Fashion <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Electronics <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Beauty <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Home Improvement <i class="fa-solid fa-chevron-down"></i></button>
    <button class="category-btn">Sports, Toys & Luggage <i class="fa-solid fa-chevron-down"></i></button>
  </nav>

  <main class="banner-container">
    <button class="carousel-btn left"><i class="fa-solid fa-chevron-left"></i></button>
    
    <section class="hero-banner">
      <div class="banner-content">
        <div class="banner-subtitle">Best Deal Online on smart watches</div>
        <h1 class="banner-title">SMART WEARABLE.</h1>
        <div class="banner-discount">UP TO 80% OFF</div>
      </div>

      <div class="carousel-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </section>

    <button class="carousel-btn right"><i class="fa-solid fa-chevron-right"></i></button>
  </main>

</body>
</html>
